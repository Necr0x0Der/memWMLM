[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memwmlm"
version = "0.1.0"
description = "Experiments with writable memory around frozen language models"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.51",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
