# Episodic source-token KV reader at the first four decoder blocks.
# Short smoke defaults, NOT a converged training schedule; use a distinct checkpoint.
model: Qwen/Qwen3-1.7B
train_file: artifacts/babi/tasks_1-20_v1-2/en-10k/qa1_single-supporting-fact_train.txt
output: runs/babi-episodic/reader-early.pt
device: cuda
dtype: bfloat16
steps: 2000
learning_rate: 0.0001
seed: 0
injection_indices: [0, 1, 2, 3]
reader_heads: 8
gate_bias_init: -2.0
lora_rank: 8
lora_alpha: 16.0
log_every: 50
save_every: 500
