[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memwmlm"
version = "0.1.0"
description = "Experiments with writable memory around frozen language models"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.4",
  "transformers>=4.51",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
rag = [
  "faiss-cpu>=1.12,<2",
  "langchain>=1.4.9,<2",
  "langchain-community>=0.4.2,<0.5",
  "langchain-core>=1.7.7,<2",
  "langchain-text-splitters>=1.1.3,<2",
  "sentence-transformers>=5.1,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
