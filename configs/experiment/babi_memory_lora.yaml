# Application-only LoRA ablation for the reset-pair embedding-memory test.
# Source encoding always keeps LoRA disabled. q_proj/o_proj LoRA is active only
# in the application pass and only in the final injection_layers Qwen blocks.
model: Qwen/Qwen3-1.7B
train_file: artifacts/babi/tasks_1-20_v1-2/en-10k/qa1_single-supporting-fact_train.txt
output: runs/babi-memory/reset-pair-lora-r8.pt
device: cuda
dtype: bfloat16

memory_width: 512
memory_cells: 32
writer_heads: 8
reader_heads: 8
injection_layers: 4
gate_bias_init: -2.0

lora_rank: 8
lora_alpha: 16.0
lora_dropout: 0.0
source_lora_rank: 0
source_lora_alpha: 16.0
source_lora_dropout: 0.0

steps: 10000
batch_size: 8
learning_rate: 0.0001
adam_beta1: 0.9
adam_beta2: 0.999
weight_decay: 0.01
max_grad_norm: 1.0
seed: 0
log_every: 50
save_every: 500
