# Matched task-adapted full-context control; answer+EOS training, candidate-likelihood evaluation.
model: Qwen/Qwen3-1.7B
train_file: artifacts/babi/tasks_1-20_v1-2/en-10k/qa1_single-supporting-fact_train.txt
output: runs/babi-full-context/lora-r8.pt
device: cuda
dtype: bfloat16
lora_rank: 8
lora_alpha: 16.0
lora_dropout: 0.0
lora_layers: 4
steps: 20000
batch_size: 32
learning_rate: 0.00005
adam_beta1: 0.9
adam_beta2: 0.999
weight_decay: 0.01
max_grad_norm: 1.0
seed: 0
log_every: 50
save_every: 500
