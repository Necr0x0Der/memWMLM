# First writable-memory sanity check. Qwen weights remain frozen.
memory_width: 512
memory_cells: 32
writer_heads: 8
reader_heads: 8
injection_layers: 4

# These are consumed as CLI defaults today; keep them versioned beside the
# architecture so later config composition does not change the experiment.
steps: 2000
batch_size: 8
learning_rate: 0.0003
